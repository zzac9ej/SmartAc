<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷氣遙控器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            gap: 1.5rem;
        }
        .error-icon { font-size: 5rem; }
        .error-title { font-size: 2rem; font-weight: 900; color: var(--text-primary); }
        .error-desc { font-size: 1.2rem; color: var(--text-secondary); line-height: 1.8; }
    </style>
</head>
<body>
    <main class="app-container">
        <div class="error-page">
            <div class="error-icon">🔒</div>
            <div class="error-title">請使用正確的連結</div>
            <div class="error-desc">
                此頁面需要透過專屬連結存取。<br>
                請聯繫管理員取得連結。
            </div>
        </div>
    </main>
</body>
</html>
